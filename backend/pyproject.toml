[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mudaletunnel"
dynamic = ["version"]
description = "SSH tunnels, nmap scanning, network pivoting — standalone CLI or web dashboard"
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "../README.md"
authors = [
    { name = "Ori Ashkenazi", email = "oriash94@gmail.com" },
]
keywords = ["pentest", "pivoting", "ssh-tunnel", "nmap", "red-team", "cybersecurity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Django",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "pydantic>=2.10",
    "defusedxml>=0.7",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
server = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "django-filter>=24.3",
    "channels>=4.2",
    "channels-redis>=4.2",
    "daphne>=4.1",
    "whitenoise>=6.8",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "model-bakery>=1.20",
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/TarzEH/MudaleTunnel"
Repository = "https://github.com/TarzEH/MudaleTunnel"
Issues = "https://github.com/TarzEH/MudaleTunnel/issues"
Changelog = "https://github.com/TarzEH/MudaleTunnel/blob/master/CHANGELOG.md"

[project.scripts]
mudale = "mudale_cli.main:main"

[tool.hatch.version]
path = "mudale/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mudale", "apps", "mudale_cli", "mudale_core", "mudale_console", "mudale_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]
"conftest.py" = ["S106"]
"**/settings/**" = ["S105", "F403", "F405"]
"mudale_core/state.py" = ["S608"]
"mudale_core/supervisor.py" = ["S314"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mudale.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "-ra --strict-markers"
testpaths = ["apps", "mudale", "mudale_cli", "mudale_core", "mudale_engine", "tests"]
