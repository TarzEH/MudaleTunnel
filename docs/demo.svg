<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="'SF Mono','Cascadia Code','JetBrains Mono','Fira Code','Menlo',monospace" font-size="13">
  <style>
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    .cursor { animation: blink 1s step-end infinite }
    .green  { fill: #50fa7b }
    .cyan   { fill: #8be9fd }
    .yellow { fill: #f1fa8c }
    .red    { fill: #ff5555 }
    .purple { fill: #bd93f9 }
    .orange { fill: #ffb86c }
    .dim    { fill: #6272a4 }
    .white  { fill: #f8f8f2 }
    .bold   { font-weight: bold }
    text    { fill: #f8f8f2 }

    /* Scene timing – each scene fades in, holds, fades out */
    .scene { opacity: 0 }

    /* Scene 1: Banner + show modules (0s-7s) */
    .s1 { animation: scene 28s linear infinite }
    @keyframes scene {
      0%    { opacity: 1 }
      23%   { opacity: 1 }
      25%   { opacity: 0 }
      100%  { opacity: 0 }
    }

    /* Scene 2: use tunnel + set + run (7s-14s) */
    .s2 { animation: scene2 28s linear infinite }
    @keyframes scene2 {
      0%    { opacity: 0 }
      25%   { opacity: 0 }
      27%   { opacity: 1 }
      48%   { opacity: 1 }
      50%   { opacity: 0 }
      100%  { opacity: 0 }
    }

    /* Scene 3: scan + services (14s-21s) */
    .s3 { animation: scene3 28s linear infinite }
    @keyframes scene3 {
      0%    { opacity: 0 }
      50%   { opacity: 0 }
      52%   { opacity: 1 }
      73%   { opacity: 1 }
      75%   { opacity: 0 }
      100%  { opacity: 0 }
    }

    /* Scene 4: jobs overview (21s-28s) */
    .s4 { animation: scene4 28s linear infinite }
    @keyframes scene4 {
      0%    { opacity: 0 }
      75%   { opacity: 0 }
      77%   { opacity: 1 }
      98%   { opacity: 1 }
      100%  { opacity: 0 }
    }
  </style>

  <!-- Terminal window chrome -->
  <rect width="880" height="560" rx="8" fill="#282a36"/>
  <rect width="880" height="36" rx="8" fill="#21222c"/>
  <rect y="28" width="880" height="8" fill="#21222c"/>
  <circle cx="20" cy="18" r="6" fill="#ff5555"/>
  <circle cx="40" cy="18" r="6" fill="#f1fa8c"/>
  <circle cx="60" cy="18" r="6" fill="#50fa7b"/>
  <text x="440" y="22" text-anchor="middle" class="dim" font-size="12">mudale console — acme-internal</text>

  <!-- ═══ Scene 1: Banner + show modules ═══ -->
  <g class="scene s1">
    <!-- Banner -->
    <text x="30" y="68" class="green bold" font-size="14">
      ╔╦╗╦ ╦╔╦╗╔═╗╦  ╔═╗</text>
    <text x="30" y="86" class="green bold" font-size="14">
      ║║║║ ║ ║║╠═╣║  ║╣</text>
    <text x="30" y="104" class="green bold" font-size="14">
      ╩ ╩╚═╝═╩╝╩ ╩╩═╝╚═╝  <tspan class="dim">v3.1.0</tspan></text>
    <text x="30" y="122" class="cyan" font-size="12">
       [ SSH tunnels • nmap scanning • network pivoting ]</text>
    <text x="30" y="146" class="dim" font-size="12">
       7 modules | 0 active tunnels | 0 running scans | engine: ready</text>

    <!-- Command: show modules -->
    <text x="30" y="178">
      <tspan class="green bold">mudale</tspan>
      <tspan class="white"> &gt; </tspan>
      <tspan class="white">show modules</tspan>
    </text>

    <text x="30" y="206" class="bold white" font-size="13">Modules</text>
    <text x="30" y="222" class="dim">════════════════════════════════════════════════════════════════════</text>

    <text x="40" y="244" class="cyan">tunnel/ssh_local</text>
    <text x="290" y="244" class="dim">Local port forward through an SSH jump host</text>

    <text x="40" y="264" class="cyan">tunnel/ssh_dynamic</text>
    <text x="290" y="264" class="dim">SOCKS5 proxy through an SSH jump host</text>

    <text x="40" y="284" class="cyan">tunnel/ssh_remote</text>
    <text x="290" y="284" class="dim">Reverse port forward from target to local</text>

    <text x="40" y="304" class="cyan">tunnel/ssh_remote_dynamic</text>
    <text x="290" y="304" class="dim">Reverse SOCKS5 proxy from target</text>

    <text x="40" y="324" class="cyan">tunnel/ligolo</text>
    <text x="290" y="324" class="dim">Full layer-3 pivot via ligolo-ng</text>

    <text x="40" y="344" class="cyan">scan/nmap</text>
    <text x="290" y="344" class="dim">Port scan through an active tunnel</text>

    <text x="40" y="364" class="cyan">pivot/auto</text>
    <text x="290" y="364" class="dim">Auto-discover and pivot through hosts</text>

    <text x="30" y="396">
      <tspan class="green bold">mudale</tspan>
      <tspan class="white"> &gt; </tspan>
      <tspan class="cursor white">█</tspan>
    </text>
  </g>

  <!-- ═══ Scene 2: use tunnel + set options + run ═══ -->
  <g class="scene s2">
    <text x="30" y="68">
      <tspan class="green bold">mudale</tspan>
      <tspan class="white"> &gt; </tspan>
      <tspan class="white">use tunnel/ssh_dynamic</tspan>
    </text>

    <text x="30" y="100">
      <tspan class="green bold">mudale</tspan>
      <tspan class="white"> </tspan>
      <tspan class="purple">tunnel</tspan><tspan class="dim">(</tspan><tspan class="purple">ssh_dynamic</tspan><tspan class="dim">)</tspan>
      <tspan class="white"> &gt; </tspan>
      <tspan class="white">show options</tspan>
    </text>

    <text x="30" y="128" class="bold white">Module options (tunnel/ssh_dynamic):</text>
    <text x="30" y="144" class="dim">════════════════════════════════════════════════════════════════════</text>
    <text x="40" y="164" class="bold dim">Name            Current       Required  Description</text>
    <text x="40" y="182" class="dim">──────────────  ────────────  ────────  ─────────────────────────</text>
    <text x="40" y="200"><tspan class="yellow">RHOST</tspan><tspan class="white">                             yes       SSH jump host</tspan></text>
    <text x="40" y="218"><tspan class="yellow">RPORT</tspan><tspan class="white">           22            yes       SSH port</tspan></text>
    <text x="40" y="236"><tspan class="yellow">USERNAME</tspan><tspan class="white">                          yes       SSH user</tspan></text>
    <text x="40" y="254"><tspan class="yellow">LPORT</tspan><tspan class="white">           1080          yes       Local SOCKS port</tspan></text>
    <text x="40" y="272"><tspan class="yellow">IDENTITY</tspan><tspan class="white">                          no        SSH key path</tspan></text>

    <text x="30" y="304">
      <tspan class="green bold">mudale</tspan>
      <tspan class="white"> </tspan><tspan class="purple">tunnel</tspan><tspan class="dim">(</tspan><tspan class="purple">ssh_dynamic</tspan><tspan class="dim">)</tspan>
      <tspan class="white"> &gt; set RHOST 10.4.10.99</tspan>
    </text>
    <text x="30" y="322" class="white">RHOST =&gt; 10.4.10.99</text>

    <text x="30" y="350">
      <tspan class="green bold">mudale</tspan>
      <tspan class="white"> </tspan><tspan class="purple">tunnel</tspan><tspan class="dim">(</tspan><tspan class="purple">ssh_dynamic</tspan><tspan class="dim">)</tspan>
      <tspan class="white"> &gt; set USERNAME root</tspan>
    </text>
    <text x="30" y="368" class="white">USERNAME =&gt; root</text>

    <text x="30" y="396">
      <tspan class="green bold">mudale</tspan>
      <tspan class="white"> </tspan><tspan class="purple">tunnel</tspan><tspan class="dim">(</tspan><tspan class="purple">ssh_dynamic</tspan><tspan class="dim">)</tspan>
      <tspan class="white"> &gt; run</tspan>
    </text>

    <text x="30" y="424" class="white">[<tspan class="green">*</tspan>] Starting SSH dynamic forward...</text>
    <text x="30" y="442" class="white">[<tspan class="green">+</tspan>] <tspan class="green">Tunnel #1 active</tspan> — SOCKS5 on 127.0.0.1:1080 via root@10.4.10.99</text>
    <text x="30" y="460" class="dim">[i] proxychains / browser SOCKS: 127.0.0.1:1080</text>

    <text x="30" y="492">
      <tspan class="green bold">mudale</tspan>
      <tspan class="white"> </tspan><tspan class="purple">tunnel</tspan><tspan class="dim">(</tspan><tspan class="purple">ssh_dynamic</tspan><tspan class="dim">)</tspan>
      <tspan class="white"> &gt; </tspan>
      <tspan class="cursor white">█</tspan>
    </text>
  </g>

  <!-- ═══ Scene 3: scan + services ═══ -->
  <g class="scene s3">
    <text x="30" y="68">
      <tspan class="green bold">mudale</tspan>
      <tspan class="white"> &gt; use scan/nmap</tspan>
    </text>

    <text x="30" y="96">
      <tspan class="green bold">mudale</tspan>
      <tspan class="white"> </tspan><tspan class="purple">scan</tspan><tspan class="dim">(</tspan><tspan class="purple">nmap</tspan><tspan class="dim">)</tspan>
      <tspan class="white"> &gt; set TARGET 10.4.10.0/24</tspan>
    </text>
    <text x="30" y="114" class="white">TARGET =&gt; 10.4.10.0/24</text>

    <text x="30" y="142">
      <tspan class="green bold">mudale</tspan>
      <tspan class="white"> </tspan><tspan class="purple">scan</tspan><tspan class="dim">(</tspan><tspan class="purple">nmap</tspan><tspan class="dim">)</tspan>
      <tspan class="white"> &gt; set VIA_TUNNEL 1</tspan>
    </text>
    <text x="30" y="160" class="white">VIA_TUNNEL =&gt; 1</text>

    <text x="30" y="188">
      <tspan class="green bold">mudale</tspan>
      <tspan class="white"> </tspan><tspan class="purple">scan</tspan><tspan class="dim">(</tspan><tspan class="purple">nmap</tspan><tspan class="dim">)</tspan>
      <tspan class="white"> &gt; run</tspan>
    </text>
    <text x="30" y="214" class="white">[<tspan class="cyan">*</tspan>] Scanning 10.4.10.0/24 (quick) through tunnel #1...</text>
    <text x="30" y="232" class="white">[<tspan class="green">+</tspan>] <tspan class="green">Scan complete</tspan> — 5 hosts up, 12 services found</text>

    <text x="30" y="262">
      <tspan class="green bold">mudale</tspan>
      <tspan class="white"> &gt; services</tspan>
    </text>

    <text x="30" y="290" class="bold white">Discovered Services</text>
    <text x="30" y="306" class="dim">════════════════════════════════════════════════════════════════════════════════</text>
    <text x="40" y="324" class="bold dim">Host           Port   Proto  State   Service        Version</text>
    <text x="40" y="340" class="dim">─────────────  ─────  ─────  ──────  ─────────────  ──────────────────────</text>
    <text x="40" y="358"><tspan class="white">10.4.10.1      </tspan><tspan class="cyan">22</tspan><tspan class="white">     tcp    open    ssh            OpenSSH 8.9p1</tspan></text>
    <text x="40" y="376"><tspan class="white">10.4.10.1      </tspan><tspan class="cyan">80</tspan><tspan class="white">     tcp    open    http           nginx 1.24.0</tspan></text>
    <text x="40" y="394"><tspan class="white">10.4.10.10     </tspan><tspan class="cyan">445</tspan><tspan class="white">    tcp    open    smb            Samba 4.18</tspan></text>
    <text x="40" y="412"><tspan class="white">10.4.10.10     </tspan><tspan class="cyan">3389</tspan><tspan class="white">   tcp    open    rdp            Microsoft RDP</tspan></text>
    <text x="40" y="430"><tspan class="white">10.4.10.50     </tspan><tspan class="cyan">1433</tspan><tspan class="white">   tcp    open    ms-sql-s       SQL Server 2019</tspan></text>
    <text x="40" y="448"><tspan class="white">10.4.10.50     </tspan><tspan class="cyan">3306</tspan><tspan class="white">   tcp    open    mysql          MySQL 8.0.36</tspan></text>
    <text x="30" y="466" class="dim">  ... 6 more services</text>

    <text x="30" y="496">
      <tspan class="green bold">mudale</tspan>
      <tspan class="white"> &gt; </tspan>
      <tspan class="cursor white">█</tspan>
    </text>
  </g>

  <!-- ═══ Scene 4: jobs + quick forward ═══ -->
  <g class="scene s4">
    <text x="30" y="68">
      <tspan class="green bold">mudale</tspan>
      <tspan class="white"> &gt; jobs</tspan>
    </text>

    <text x="30" y="96" class="bold white">Active Jobs</text>
    <text x="30" y="112" class="dim">════════════════════════════════════════════════════════════════════════════════</text>
    <text x="40" y="132" class="bold dim">ID   Type      Kind           Status   Description</text>
    <text x="40" y="148" class="dim">───  ────────  ─────────────  ───────  ──────────────────────────────────────</text>
    <text x="40" y="166"><tspan class="yellow"> 1</tspan><tspan class="white">   tunnel    ssh_dynamic    </tspan><tspan class="green">active</tspan><tspan class="white">   SOCKS5 127.0.0.1:1080 via root@10.4.10.99</tspan></text>
    <text x="40" y="184"><tspan class="yellow"> 2</tspan><tspan class="white">   scan      nmap           </tspan><tspan class="green">done</tspan><tspan class="white">     10.4.10.0/24 quick — 5 hosts, 12 services</tspan></text>

    <text x="30" y="220">
      <tspan class="green bold">mudale</tspan>
      <tspan class="white"> &gt; forward 10.4.10.50 1433</tspan>
    </text>
    <text x="30" y="246" class="white">[<tspan class="green">*</tspan>] Creating local forward: 127.0.0.1:1433 → 10.4.10.50:1433</text>
    <text x="30" y="264" class="white">[<tspan class="green">+</tspan>] <tspan class="green">Tunnel #3 active</tspan> — SQL Server accessible at localhost:1433</text>

    <text x="30" y="296">
      <tspan class="green bold">mudale</tspan>
      <tspan class="white"> &gt; status</tspan>
    </text>

    <text x="30" y="324" class="bold white">Engine Status</text>
    <text x="30" y="340" class="dim">════════════════════════════════════════════════════════════</text>
    <text x="40" y="360"><tspan class="dim">Engine:</tspan><tspan class="white">    standalone v3.1.0</tspan></text>
    <text x="40" y="378"><tspan class="dim">SSH:</tspan><tspan class="white">       </tspan><tspan class="green">available</tspan><tspan class="white"> (OpenSSH_9.7)</tspan></text>
    <text x="40" y="396"><tspan class="dim">Nmap:</tspan><tspan class="white">      </tspan><tspan class="green">available</tspan><tspan class="white"> (7.95)</tspan></text>
    <text x="40" y="414"><tspan class="dim">Tunnels:</tspan><tspan class="white">   2 active / 0 failed</tspan></text>
    <text x="40" y="432"><tspan class="dim">Scans:</tspan><tspan class="white">     1 completed (12 services found)</tspan></text>
    <text x="40" y="450"><tspan class="dim">Workspace:</tspan><tspan class="white"> default</tspan></text>

    <text x="30" y="486">
      <tspan class="green bold">mudale</tspan>
      <tspan class="white"> &gt; </tspan>
      <tspan class="cursor white">█</tspan>
    </text>
  </g>
</svg>
