name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version in the code
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(grep -oE '__version__ = "[^"]+"' backend/mudale/__init__.py | cut -d'"' -f2)"
          echo "tag=$tag  code=$code"
          test "$tag" = "$code" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ ($code)."
            echo "Update backend/mudale/__init__.py, commit, then re-tag."
            exit 1
          }

  test:
    name: Full suite
    needs: verify
    uses: ./.github/workflows/ci.yml

  # ── Standalone binaries (PyInstaller) ──────────────────────────────

  binaries:
    name: Binary (${{ matrix.os }})
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mudale-linux-amd64
            ext: ""
          - os: macos-latest
            artifact: mudale-darwin-arm64
            ext: ""
          - os: windows-latest
            artifact: mudale-windows-amd64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install pyinstaller
          pip install pydantic defusedxml prompt_toolkit

      - name: Build binary
        working-directory: backend
        run: |
          pyinstaller --onefile --name mudale \
            --hidden-import mudale_core \
            --hidden-import mudale_core.enums \
            --hidden-import mudale_core.specs \
            --hidden-import mudale_core.state \
            --hidden-import mudale_core.modules \
            --hidden-import mudale_core.daemon \
            --hidden-import mudale_core.process \
            --hidden-import mudale_core.supervisor \
            --hidden-import mudale_core.adapters \
            --hidden-import mudale_core.adapters.base \
            --hidden-import mudale_core.adapters.ssh \
            --hidden-import mudale_core.adapters.nmap \
            --hidden-import mudale_console \
            --hidden-import mudale_console.app \
            --hidden-import mudale_console.banner \
            --hidden-import mudale_console.completer \
            --hidden-import mudale_cli \
            --hidden-import mudale_cli.main \
            --hidden-import mudale_cli.client \
            --hidden-import mudale_cli.output \
            --paths . \
            mudale_cli/main.py
        shell: bash

      - name: Rename artifact
        working-directory: backend/dist
        run: mv mudale${{ matrix.ext }} ${{ matrix.artifact }}${{ matrix.ext }}
        shell: bash

      - name: Smoke test (non-Windows)
        if: matrix.os != 'windows-latest'
        working-directory: backend/dist
        run: |
          chmod +x ${{ matrix.artifact }}
          ./${{ matrix.artifact }} --help

      - name: Smoke test (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: backend/dist
        run: .\${{ matrix.artifact }}.exe --help
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.artifact }}
          path: backend/dist/${{ matrix.artifact }}${{ matrix.ext }}

  # ── Python wheel + dashboard tarball ───────────────────────────────

  artifacts:
    name: Build artifacts
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }

      - uses: astral-sh/setup-uv@v5

      - name: Build the dashboard
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build the Python distribution
        working-directory: backend
        run: uv build --out-dir ../dist

      - name: Bundle the dashboard
        run: tar -czf dist/mudaletunnel-dashboard-${{ github.ref_name }}.tar.gz -C frontend dist

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with: { name: release-artifacts, path: dist/ }

  # ── Docker image ───────────────────────────────────────────────────

  image:
    name: Publish image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── GitHub Release ─────────────────────────────────────────────────

  publish:
    name: Draft the release
    needs: [artifacts, binaries, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/download-artifact@v4
        with: { name: release-artifacts, path: dist }

      - uses: actions/download-artifact@v4
        with: { name: binary-mudale-linux-amd64, path: dist }

      - uses: actions/download-artifact@v4
        with: { name: binary-mudale-darwin-arm64, path: dist }

      - uses: actions/download-artifact@v4
        with: { name: binary-mudale-windows-amd64, path: dist }

      - name: Checksums (include binaries)
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Release notes
        id: notes
        run: |
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo 'body<<NOTES'
            if [ -n "$previous" ]; then
              echo "### Changes since $previous"
              echo
              git log --no-merges --pretty='- %s' "$previous..${GITHUB_REF_NAME}"
            else
              echo "First tagged release."
            fi
            echo
            echo '### Install'
            echo
            echo '#### Standalone binary (no Python needed)'
            echo
            echo '```bash'
            echo '# Linux'
            echo "wget https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/mudale-linux-amd64"
            echo 'chmod +x mudale-linux-amd64 && sudo mv mudale-linux-amd64 /usr/local/bin/mudale'
            echo
            echo '# macOS (Apple Silicon)'
            echo "curl -LO https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/mudale-darwin-arm64"
            echo 'chmod +x mudale-darwin-arm64 && sudo mv mudale-darwin-arm64 /usr/local/bin/mudale'
            echo
            echo '# Windows'
            echo "# Download mudale-windows-amd64.exe from the assets below"
            echo '```'
            echo
            echo '#### pip install'
            echo
            echo '```bash'
            echo "pip install mudaletunnel==${GITHUB_REF_NAME#v}"
            echo '```'
            echo
            echo '#### Docker'
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}"
            echo '```'
            echo
            echo 'Verify downloads against `SHA256SUMS`.'
            echo NOTES
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: ${{ steps.notes.outputs.body }}
          draft: true
          generate_release_notes: false
